name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump'
        type: choice
        options: [patch, minor, major, auto]
        default: patch

permissions:
  actions: write

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request a verified release from develop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
          HAS_RELEASE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/develop' ]; then
            echo 'Run Release from the develop branch.' >&2
            exit 1
          fi
          if [ -z "$RELEASE_APP_CLIENT_ID" ] || [ -z "$RELEASE_APP_SLUG" ] || [ "$HAS_RELEASE_KEY" != 'true' ]; then
            echo 'Configure the release GitHub App first: docs/publishing.md#repository-setup' >&2
            exit 1
          fi
          gh workflow run ci.yml --ref develop -f prepare_release=true -f "release_type=$RELEASE_TYPE"
          echo "Delivery continues in [CI and recovery](https://github.com/$GH_REPO/actions/workflows/ci.yml). This request finishing does not mean publication has finished." >> "$GITHUB_STEP_SUMMARY"
