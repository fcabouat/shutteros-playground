name: Verify and publish

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      resume_release:
        description: 'Publish or resume the current main version after verification'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate workflow syntax
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Validate the Ubuntu kit without modifying the runner
        run: |
          shellcheck deployment/ubuntu/*.sh deployment/ubuntu/session deployment/ubuntu/launch-chromium deployment/ubuntu/tests/*.sh
          for script in deployment/ubuntu/*.sh deployment/ubuntu/session deployment/ubuntu/launch-chromium deployment/ubuntu/tests/*.sh; do
            sh -n "$script"
          done
          node deployment/ubuntu/tests/configuration-contract.test.mjs
          sh deployment/ubuntu/tests/installer-refusal.test.sh
          sh deployment/ubuntu/tests/installer-nominal.test.sh
          python3 -m json.tool deployment/ubuntu/chromium-policy.json >/dev/null
          python3 deployment/ubuntu/validate-config.py static/kiosk-config.json
          sed 's|^ExecStart=/usr/local/lib/shutteros-kiosk/session$|ExecStart=/usr/bin/true|' \
            deployment/ubuntu/shutteros-kiosk.service > "$RUNNER_TEMP/shutteros-kiosk.service"
          cp deployment/ubuntu/shutteros-static.service "$RUNNER_TEMP/shutteros-static.service"
          systemd-analyze verify \
            "$RUNNER_TEMP/shutteros-static.service" "$RUNNER_TEMP/shutteros-kiosk.service"
      - run: pnpm audit --audit-level high
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: pnpm verify
      - run: pnpm build:storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shutteros-static-and-portable
          path: dist/
          retention-days: 14
      - name: Select the GitHub Pages base path
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          if [ "${name,,}" = "${owner,,}.github.io" ]; then
            echo 'BASE_PATH=' >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$name" >> "$GITHUB_ENV"
          fi
      - name: Build and exercise the Pages artifact
        run: |
          pnpm build
          pnpm test:e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: verify
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.resume_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Tag the verified commit and propose integration
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  publication-summary:
    needs: [verify, deploy, release]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report each publication stage
        env:
          VERIFY: ${{ needs.verify.result }}
          PAGES: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RELEASE: ${{ needs.release.result }}
        run: |
          {
            echo '## Publication outcomes'
            echo "- Verification: $VERIFY"
            echo "- Pages: $PAGES $PAGE_URL"
            echo "- Tag, GitHub release and integration PR: $RELEASE"
            echo 'A successful verification alone does not mean publication is complete.'
            echo 'See the release job summary for verified artifact links. Check CodeQL separately under Security.'
          } >> "$GITHUB_STEP_SUMMARY"
